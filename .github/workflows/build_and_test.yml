---
#
# This workflow runs the Synapse Stack Builder and then builds and runs the tests
# for the Synapse Repository Services.
#
# These parameters can be overridden with repo's action variables:
#
# - USER (the 'user' parameter for the Synapse build): defaults to repo' owner.  Should be alphanumeric only.
# - STACK_BUILDER_REPO_OWNER: defaults to Sage-Bionetworks
# - STACK_BUILDER_BRANCH: defaults to develop
# - FULL_BUILD: if true, will do a full build, vs. an abbreviated "feature build"
# - EXTRA_ARGS: pass extra arguments to maven build
#
# The place to set The page where you set the "repository variables" is
# https://github.com/<owner>/Synapse-Repository-Services/settings/variables/actions
# where <owner> is the name of one's fork of this repository.
#
name: main

on:
  push:
    branches: ['*']
  pull_request:
    branches: [develop]

# let only one copy of the workflow run at a time; the rest wait their turn in FIFO order
# instead of being cancelled. Dependabot queues separately so a batch of dependency bumps
# never holds up a developer's build, and never runs two at once against the shared
# Dependabot stack
concurrency:
  group: ${{ github.workflow }}${{ github.event.pull_request.user.login == 'dependabot[bot]' && '-dependabot' || '' }}
  cancel-in-progress: false
  queue: max

jobs:
  build_and_test:
    # Pull request runs are reserved for Dependabot's dependency bumps against develop;
    # every other pull request is already covered by the push trigger on its branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for git commands to work correctly

      - name: Static Analysis
        uses: pre-commit/action@v3.0.0

      - name: Determine Pipeline Parameters
        id: pipeline-params
        run: |
          # get the 'user' parameter, either from the repo' env or repo' owner if not set
          if [ ${{ vars.USER }} ]; then
            USER=${{ vars.USER }}
          else
            alpha_only_trunc_repo_name=$(echo "${GITHUB_REPOSITORY_OWNER//[^[:alnum:]]/}" | tr '[:upper:]' '[:lower:]' | cut -c1-7)
            USER=$alpha_only_trunc_repo_name
          fi
          # give Dependabot its own stack so its builds never collide with another build
          if [[ "${{ github.event.pull_request.user.login }}" == "dependabot[bot]" ]]; then
            USER=${USER}bot
          fi
          echo "USER=$USER" >> $GITHUB_OUTPUT
          # capture the current branch as an environment variable
          BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          # get repo' and branch specifying the version of the stack builder to use
          if [ ${{ vars.STACK_BUILDER_REPO_OWNER }} ]; then
            STACK_BUILDER_REPO_OWNER=${{ vars.STACK_BUILDER_REPO_OWNER }}
           else
            STACK_BUILDER_REPO_OWNER=Sage-Bionetworks
          fi
          if [ ${{ vars.STACK_BUILDER_BRANCH }} ]; then
            STACK_BUILDER_BRANCH=${{ vars.STACK_BUILDER_BRANCH }}
          else
            STACK_BUILDER_BRANCH=develop
          fi
          echo "STACK_BUILDER_REPO_OWNER=$STACK_BUILDER_REPO_OWNER" >> $GITHUB_OUTPUT
          echo "STACK_BUILDER_BRANCH=$STACK_BUILDER_BRANCH" >> $GITHUB_OUTPUT
          FULL_BUILD=${{ vars.FULL_BUILD }}
          EXTRA_ARGS=${{ vars.EXTRA_ARGS }}
          # for builds in Sage-Bionetworks repo', publish build artifacts
          if [[ $GITHUB_REPOSITORY_OWNER == "Sage-Bionetworks" ]]; then
            if [[ $BRANCH == "develop" ]]; then
              GIT_COMMIT=${{ github.sha }}
              ARTIFACT_VERSION=$(date +%Y-%m-%d_%H-%M)"_"${GIT_COMMIT:0:7}
            elif [[ $BRANCH =~ "release-" ]]; then
              git fetch --tags
              ARTIFACT_VERSION=$(git describe --tags)
            fi
          fi
          if [[ $ARTIFACT_VERSION ]]; then
            echo "ARTIFACT_VERSION=$ARTIFACT_VERSION" >> $GITHUB_OUTPUT
          fi
          PIPELINE_PARAMETERS=\
          "BuildParamUser=$USER,\
          FullBuild=$FULL_BUILD,\
          MavenExtraArgs=$EXTRA_ARGS,\
          ArtifactVersion=$ARTIFACT_VERSION"
          echo "PIPELINE_PARAMETERS=$PIPELINE_PARAMETERS" >> $GITHUB_OUTPUT

      - id: display-artifact-version
        name: Display Artifact Version
        run: |
          if [[ "${{ steps.pipeline-params.outputs.ARTIFACT_VERSION }}" ]]; then
            echo "Build will publish artifacts with version" ${{ steps.pipeline-params.outputs.ARTIFACT_VERSION }}
          else
            echo "Artifacts will not be published for this build"
          fi

      - id: oidc
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::449435941126:role/sagebase-github-oidc-sage-bionetworks-synapse-build
          aws-region: us-east-1
          # eight hours
          role-duration-seconds: 28800

      - name: Capture Session Credentials
        run: |
          # We will capture the long-lived session token to use for the build
          # Note: We cannot pass the credentials as inputs to code pipeline
          # since the token exceeded the 1000 character limit for input variables.
          SECRET_NAME="/build/session-token/${{ steps.pipeline-params.outputs.USER }}"
          SECRET_VALUE='{"AwsAccessKeyId":"${{ env.AWS_ACCESS_KEY_ID }}", "AwsSecretAccessKey":"${{ env.AWS_SECRET_ACCESS_KEY }}", "AwsSessionToken":"${{ env.AWS_SESSION_TOKEN }}"}'
          # Try to update the secret value first
          if aws secretsmanager put-secret-value \
              --secret-id "$SECRET_NAME" \
              --secret-string "$SECRET_VALUE" \
              2>/dev/null; then
              echo "Secret updated successfully"
          else
              echo "Secret doesn't exist, creating new secret..."
              if aws secretsmanager create-secret \
                  --name "$SECRET_NAME" \
                  --secret-string "$SECRET_VALUE" \
                  --description "Build credentials for ${{ steps.pipeline-params.outputs.USER }}"; then
                  echo "Secret created successfully"
              else
                  echo "Failed to create secret"
                  exit 1
              fi
          fi

    outputs:
      USER: ${{ steps.pipeline-params.outputs.USER }}
      STACK_BUILDER_REPO_OWNER: ${{ steps.pipeline-params.outputs.STACK_BUILDER_REPO_OWNER }}
      STACK_BUILDER_BRANCH: ${{ steps.pipeline-params.outputs.STACK_BUILDER_BRANCH }}
      PIPELINE_PARAMETERS: ${{ steps.pipeline-params.outputs.PIPELINE_PARAMETERS }}

  upload_source:
    needs: build_and_test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Synapse Repo
        uses: actions/checkout@v5

      - name: Checkout Stack Builder Repo
        uses: actions/checkout@v5
        with:
          repository: ${{ needs.build_and_test.outputs.STACK_BUILDER_REPO_OWNER }}/Synapse-Stack-Builder
          ref: ${{ needs.build_and_test.outputs.STACK_BUILDER_BRANCH }}
          path: stack-builder

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::449435941126:role/sagebase-github-oidc-sage-bionetworks-synapse-build
          aws-region: us-east-1

      - name: Upload Sources to S3
        id: upload
        run: |
          BUCKET="synapse-build-source-${{ needs.build_and_test.outputs.USER }}"

          # Ensure bucket exists with versioning and lifecycle policy
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-lifecycle-configuration --bucket "$BUCKET" \
              --lifecycle-configuration '{"Rules":[{"ID":"PurgeOldUploads","Status":"Enabled","Expiration":{"Days":7},"Filter":{"Prefix":""}}]}'
          fi

          # Resolve Stack Builder commit SHA
          STACK_BUILDER_SHA=$(git -C stack-builder rev-parse HEAD)

          SYNAPSE_KEY="${{ github.repository_owner }}/Synapse-Repository-Services/${{ github.sha }}/Synapse-Repository-Services.zip"
          STACK_BUILDER_KEY="${{ needs.build_and_test.outputs.STACK_BUILDER_REPO_OWNER }}/Synapse-Stack-Builder/${STACK_BUILDER_SHA}/Synapse-Stack-Builder.zip"

          # Zip and upload Synapse repo
          zip -qr /tmp/synapse.zip . -x '.git/*' 'stack-builder/*'
          aws s3 cp /tmp/synapse.zip "s3://${BUCKET}/${SYNAPSE_KEY}"

          # Zip and upload Stack Builder repo
          cd stack-builder
          zip -qr /tmp/stack-builder.zip . -x '.git/*'
          aws s3 cp /tmp/stack-builder.zip "s3://${BUCKET}/${STACK_BUILDER_KEY}"

          echo "SOURCE_BUCKET=$BUCKET" >> $GITHUB_OUTPUT
          echo "SYNAPSE_SOURCE_KEY=$SYNAPSE_KEY" >> $GITHUB_OUTPUT
          echo "STACK_BUILDER_SOURCE_KEY=$STACK_BUILDER_KEY" >> $GITHUB_OUTPUT

    outputs:
      SOURCE_BUCKET: ${{ steps.upload.outputs.SOURCE_BUCKET }}
      SYNAPSE_SOURCE_KEY: ${{ steps.upload.outputs.SYNAPSE_SOURCE_KEY }}
      STACK_BUILDER_SOURCE_KEY: ${{ steps.upload.outputs.STACK_BUILDER_SOURCE_KEY }}

  invoke_workflow:
    needs: [build_and_test, upload_source]
    uses: Sage-Bionetworks/Synapse-Code-Pipeline/.github/workflows/execute_code_pipeline_v2.yml@main
    with:
      CODE_PIPELINE_CF_TEMPLATE: configuration/build/codepipeline_cf_template.yaml
      PIPELINE_NAME: Synapse-Build-${{ needs.build_and_test.outputs.USER }}
      PIPELINE_PARAMETERS: "${{ needs.build_and_test.outputs.PIPELINE_PARAMETERS }},SourceBucket=${{ needs.upload_source.outputs.SOURCE_BUCKET }},SynapseSourceKey=${{ needs.upload_source.outputs.SYNAPSE_SOURCE_KEY }},StackBuilderSourceKey=${{ needs.upload_source.outputs.STACK_BUILDER_SOURCE_KEY }}"
      ROLE_TO_ASSUME: arn:aws:iam::449435941126:role/sagebase-github-oidc-sage-bionetworks-synapse-build
      STATUS_REPO_OWNER: Sage-Bionetworks
      STATUS_REPOSITORY: Synapse-Repository-Services
    secrets: inherit
    permissions:
      # https://graphite.dev/guides/github-actions-permissions
      id-token: write
      contents: read
      deployments: write
      security-events: write
      statuses: write
      actions: write
      checks: write
...
