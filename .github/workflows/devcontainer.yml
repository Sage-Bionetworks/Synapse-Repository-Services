name: devcontainer

on:
  push:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Configure developer name
        run: echo "DEVELOPER_NAME=ci" > .devcontainer/.env

      - name: Build container and run DB smoke test
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: mvn -B -pl lib/id-generator -am install -Dtest=IdGeneratorImplTest -Dsurefire.failIfNoSpecifiedTests=false
